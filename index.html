<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Academy — DevOps & AI Architect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <a class="skip" id="skipLink" href="#main">Skip to main content</a>
  <header class="hero" role="banner">
    <nav class="topbar" aria-label="Main navigation">
      <span class="brand-lockup">
        <span class="crest" aria-hidden="true"><span class="crest-ring"></span><span class="crest-mark"></span></span>
        <strong id="brand">DevOps + AI Architect</strong>
      </span>
      <div class="switcher switcher-track" role="tablist" aria-label="Course track">
        <button id="trackDevops" type="button" class="switch-btn">DevOps</button>
        <button id="trackAi" type="button" class="switch-btn">AI Architect</button>
      </div>
      <div class="switcher" role="tablist" aria-label="Language">
        <button id="langHe" type="button" class="switch-btn">עברית</button>
        <button id="langEn" type="button" class="switch-btn">English</button>
      </div>
      <div class="actions">
        <button id="contrastBtn" type="button"></button>
        <button id="fontBtn" type="button"></button>
        <button id="resetProgress" type="button"></button>
      </div>
    </nav>
    <section class="hero-content">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="track-select" role="tablist" aria-label="Choose your course track">
        <p class="track-select-label" id="trackSelectLabel"></p>
        <div class="track-cards">
          <button id="trackDevopsHero" type="button" class="track-card">
            <span class="track-card-name">DevOps</span>
            <span class="track-card-desc" id="trackDevopsHeroDesc"></span>
          </button>
          <button id="trackAiHero" type="button" class="track-card">
            <span class="track-card-name">AI Architect</span>
            <span class="track-card-desc" id="trackAiHeroDesc"></span>
          </button>
        </div>
      </div>
      <div class="hero-buttons">
        <a class="button primary" id="heroStartBtn" href="#lessons"></a>
        <a class="button" id="heroOptionsBtn" href="#learning-options"></a>
      </div>
    </section>
  </header>

  <main id="main">
    <section class="panel" aria-labelledby="how-title">
      <h2 id="howTitle"></h2>
      <div class="grid three" id="howCards"></div>
    </section>

    <section id="learning-options" class="panel" aria-labelledby="options-title">
      <h2 id="optionsTitle"></h2>
      <ul class="cards" id="optionsList"></ul>
    </section>

    <section id="lessons" class="panel" aria-labelledby="lessons-title">
      <h2 id="lessonsTitle"></h2>
      <div id="lessonGrid" class="lesson-grid" aria-live="polite"></div>
    </section>

    <section class="lesson-view panel" aria-labelledby="lessonTitle">
      <div class="lesson-head">
        <div>
          <p class="eyebrow" id="lessonNumber"></p>
          <h2 id="lessonTitle"></h2>
        </div>
        <label class="done-label"><input id="doneCheck" type="checkbox" /> <span id="doneCheckLabel"></span></label>
      </div>

      <div class="tabs" role="tablist" aria-label="Learning modes">
        <button class="tab active" id="tabSlides" data-tab="slides" role="tab" aria-selected="true"></button>
        <button class="tab" id="tabRead" data-tab="read" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabExamples" data-tab="examples" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabPractice" data-tab="practice" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabTutor" data-tab="tutor" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabPodcast" data-tab="podcast" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabQuiz" data-tab="quiz" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabResources" data-tab="resources" role="tab" aria-selected="false"></button>
      </div>

      <section id="slides" class="tab-panel active">
        <div class="slide-player" aria-live="polite">
          <div class="slide-screen">
            <p class="eyebrow" id="slideBadge"></p>
            <h3 id="slideTitle"></h3>
            <div id="slideBody"></div>
            <p class="narration" id="slideNarration"></p>
          </div>
          <div class="player-controls">
            <button id="playBtn" type="button"></button>
            <button id="prevSlide" type="button"></button>
            <button id="nextSlide" type="button"></button>
            <div class="progressbar" aria-label="Slide progress"><span id="slideProgress"></span></div>
            <span id="slideCounter"></span>
          </div>
        </div>
      </section>

      <section id="read" class="tab-panel"></section>
      <section id="examples" class="tab-panel"></section>
      <section id="practice" class="tab-panel"></section>
      <section id="tutor" class="tab-panel">
        <div class="tutor-layout">
          <aside class="avatar-card" aria-label="Virtual private tutor">
            <label class="persona-picker" for="teacherPersona">
              <span id="tutorPersonaLabelText"></span>
              <select id="teacherPersona"></select>
            </label>
            <div id="teacherAvatar" class="teacher-avatar" aria-hidden="true">
              <div class="avatar-head">
                <div class="hair"></div>
                <div class="eyes"><span></span><span></span></div>
                <div class="glasses"></div>
                <div class="mouth"></div>
              </div>
              <div class="avatar-body"></div>
            </div>
            <h3 id="teacherName"></h3>
            <p id="tutorStatus"></p>
            <div class="voice-controls compact">
              <button id="tutorSpeakToggle" type="button"></button>
              <button id="tutorIntro" type="button"></button>
            </div>
          </aside>
          <section class="tutor-chat" aria-label="Chat with private tutor">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div id="quickPrompts" class="quick-prompts" aria-label="Quick questions"></div>
            <form id="chatForm" class="chat-form">
              <label class="sr-only" id="chatInputLabel" for="chatInput"></label>
              <input id="chatInput" type="text" autocomplete="off" />
              <button id="chatSendBtn" type="submit"></button>
            </form>
          </section>
        </div>
      </section>

      <section id="podcast" class="tab-panel">
        <div class="voice-panel">
          <div>
            <h3 id="podcastHeading"></h3>
            <p id="podcastDesc"></p>
          </div>
          <div class="voice-controls">
            <label><span id="voiceLabelText"></span> <select id="voiceSelect" aria-label="Narration voice"></select></label>
            <button id="speakPodcast" type="button"></button>
            <button id="stopPodcast" type="button"></button>
          </div>
        </div>
        <div id="podcastTranscript" class="dialogue"></div>
      </section>
      <section id="quiz" class="tab-panel"></section>
      <section id="resources" class="tab-panel"></section>
    </section>
  </main>

  <footer>
    <p id="footerText"></p>
  </footer>

  <script src="courses.devops.he.js?v=2"></script>
  <script src="courses.devops.en.js?v=2"></script>
  <script src="courses.ai.he.js?v=2"></script>
  <script src="courses.ai.en.js?v=2"></script>
  <script src="resources.js?v=1"></script>
  <script src="i18n.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
